server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: ms-reclamos
  datasource:
    url: jdbc:mysql://localhost:3306/db_reclamos?createDatabaseIfNotExist=true&serverTimezone=America/Lima
    username: root
    password: mysql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8762/eureka/
  instance:
    prefer-ip-address: true